spring.application.name=e-commerce
server.port=8080

# DevTools
spring.devtools.restart.enabled=true

# Thymeleaf: no almacenar plantillas en caché
spring.thymeleaf.cache=false

# Recursos estáticos: CSS y JavaScript
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Almacenamiento dedicado para fotografías de productos (segmentado por taxonomía y SKU)
app.storage.productos-dir=uploads/productos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB


logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr([traceId:%X{traceId:-N/A}]){magenta} %clr(%-40.40logger{39}){cyan} : %m%n

logging.file.name=ecommerce-webapp/logs/e-commerce-web-application-log.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

#server.servlet.context-path = url

# propiedades para datasources
