<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar con Bootstrap 5</title>

    <!-- 1. Bootstrap CSS (Vía CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap (Opcional, para que se vea mejor) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<!-- Barra de navegación superior con el botón -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <!-- Botón que activa el Offcanvas -->
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#miSidebar" aria-controls="miSidebar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand me-auto ms-3" href="#">Mi App</a>
    </div>
</nav>

<!-- 2. EL SIDEBAR (Componente Offcanvas) -->
<!-- 'offcanvas-start' lo coloca a la izquierda. 'text-bg-dark' le da el tema oscuro -->
<div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="miSidebar" aria-labelledby="tituloSidebar">

    <!-- Cabecera del Sidebar -->
    <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title" id="tituloSidebar">Menú Principal</h5>
        <!-- Botón de cerrar (la clase btn-close-white lo hace visible en fondo oscuro) -->
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>

    <!-- Cuerpo del Sidebar (Enlaces) -->
    <div class="offcanvas-body p-0 pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link text-white px-4 py-2" href="#"><i class="bi bi-house-door me-2"></i> Inicio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white px-4 py-2" href="#"><i class="bi bi-bar-chart me-2"></i> Panel</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white px-4 py-2" href="#"><i class="bi bi-gear me-2"></i> Ajustes</a>
            </li>
            <hr class="text-secondary">
            <li class="nav-item">
                <a class="nav-link text-danger px-4 py-2" href="#"><i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión</a>
            </li>
        </ul>
    </div>
</div>

<!-- Contenido principal de la página -->
<main class="container mt-4">
    <h1>Bienvenido a tu panel</h1>
    <p>Haz clic en el ícono de la hamburguesa (☰) arriba a la izquierda para abrir el menú lateral. ¡Todo funciona sin escribir una sola línea de JavaScript!</p>
</main>

<!-- 3. Bootstrap JS (Vía CDN - Necesario para que funcione el clic) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
