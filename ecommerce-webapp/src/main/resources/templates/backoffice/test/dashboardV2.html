<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        /* estilos.css */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }

        /* Estilo base del Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh; /* Ocupa toda la altura */
            background-color: #1a1a1a;
            color: white;
            position: fixed;
            top: 0;
            left: -250px; /* Oculto por defecto */
            transition: left 0.3s ease; /* Animación suave */
            z-index: 1000;
        }

        /* Clase dinámica que agregaremos con JS para mostrarlo */
        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #0f0f0f;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-links li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            transition: background 0.2s;
        }

        .nav-links li a:hover {
            background-color: #333;
            border-left: 4px solid #00a8ff;
        }

        /* Contenido Principal */
        .content {
            margin-left: 0;
            padding: 20px;
            transition: margin-left 0.3s ease;
            width: 100%;
        }

        /* Botones básicos */
        .menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        /* Adaptación para pantallas grandes */
        @media (min-width: 768px) {
            .sidebar {
                left: 0; /* Siempre visible en PC */
            }
            .content {
                margin-left: 250px; /* Empuja el contenido a la derecha */
            }
            .menu-btn {
                display: none; /* Oculta el botón de abrir en PC */
            }
            .close-btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Botón para abrir en móviles -->
    <button id="menu-btn" class="menu-btn">☰ Abrir Menú</button>

    <!-- El Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Mi App</h3>
            <button id="close-btn" class="close-btn">×</button>
        </div>
        <ul class="nav-links">
            <li><a href="#">🏠 Inicio</a></li>
            <li><a href="#">📊 Panel</a></li>
            <li><a href="#">⚙️ Ajustes</a></li>
            <li><a href="#">🚪 Salir</a></li>
        </ul>
    </nav>

    <!-- Contenido Principal -->
    <main class="content">
        <h1>Bienvenido</h1>
        <p>Este es el contenido principal de la página.</p>
    </main>

    <script type="application/javascript">
        // script.js
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');

        // Abrir el menú
        menuBtn.addEventListener('click', () => {
            sidebar.classList.add('active');
        });

        // Cerrar el menú
        closeBtn.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });

    </script>
</body>
</html>
