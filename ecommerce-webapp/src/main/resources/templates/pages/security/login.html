<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - E-Commerce</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Reutilizamos el menú -->
<div th:replace="~{fragments/menu :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center mb-4">Iniciar Sesión</h2>

                    <!-- Alerta Verde: El usuario viene de registrarse exitosamente -->
                    <div th:if="${param.exito}" class="alert alert-success text-center">
                        ¡Cuenta creada con éxito! Ahora puedes iniciar sesión.
                    </div>

                    <!-- Alerta Roja: Error en credenciales (Spring Security lo inyectará luego) -->
                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        Correo o contraseña incorrectos.
                    </div>

                    <!--
                      El action será hacia /inicio-sesion también, pero en método POST.
                      Spring Security interceptará ese POST automáticamente más adelante.
                    -->
                    <form th:action="@{/inicio-sesion}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">Correo Electrónico</label>
                            <!-- Importante: el name debe ser 'username' para Spring Security por defecto -->
                            <input type="email" id="username" name="username" class="form-control"
                                   placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <!-- Importante: el name debe ser 'password' -->
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                        </div>

                        <div class="text-center mt-4">
                            <span class="text-muted">¿No tienes cuenta?</span>
                            <a th:href="@{/registro}" class="text-decoration-none">Regístrate aquí</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
