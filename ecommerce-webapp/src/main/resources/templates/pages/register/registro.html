<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - E-Commerce</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Reutilizamos el menú de navegación que ya creamos -->
<div th:replace="~{fragments/menu :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center mb-4">Crear una cuenta</h2>

                    <!-- Alerta dinámica: Se muestra solo si la URL trae "?error=..." -->
                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        Las contraseñas no coinciden. Por favor, inténtalo de nuevo.
                    </div>

                    <!-- El formulario conectado a tu RegistroUsuarioDTO -->
                    <form th:action="@{/registro}" th:object="${registroDTO}" method="post">

                        <div class="mb-3">
                            <label for="correoInicioSesion" class="form-label">Correo Electrónico</label>
                            <!-- th:field hace la magia: auto-genera el id, name y value -->
                            <input type="email" class="form-control" th:field="*{correoInicioSesion}"
                                   placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasenia" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" th:field="*{contrasenia}" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmarContrasenia" class="form-label">Confirmar Contraseña</label>
                            <input type="password" class="form-control" th:field="*{confirmarContrasenia}" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Registrarse</button>
                        </div>

                        <div class="text-center mt-4">
                            <span class="text-muted">¿Ya tienes una cuenta?</span>
                            <a th:href="@{/inicio-sesion}" class="text-decoration-none">Inicia sesión aquí</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
