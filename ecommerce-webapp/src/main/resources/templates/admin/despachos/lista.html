<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion de despachos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card shadow-sm p-4">
        <h2 class="mb-3 text-primary">Panel de despachos y envíos</h2>
        <p class="text-muted">Listado de pedidos

            <table class="table table-hover table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID Envio</th>
                        <th>Empresa de transporte</th>
                        <th>N° de seguimiento</th>
                        <th>Estado</th>
                        <th>Fecha de despacho</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="envio:${listaEnvios}">
                        <td th:text="${envio.idEnvio}">1</td>
                        <td th:text="${envio.empresaTransporte}">DHL</td>
                        <td th:text="${envio.numeroSeguimiento}"><TRK-9988></td>
                        <td>
                            <span class="badge bg-info text-dark" th:text=" ${envio.estadoEnvio}">En_camino</span>
                        </td>
                        <td th:text="${envio.fechaDespacho}">2026-09-22</td>
                    </tr>
                </tbody>
            </table>
        </div>
</body>
</html>
