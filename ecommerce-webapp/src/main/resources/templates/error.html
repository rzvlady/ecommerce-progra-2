<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloError} ? ${tituloError} + ' | MultiStore' : 'Error | MultiStore'">Error | MultiStore</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center transition-all">
        <!-- Icono de estado -->
        <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-rose-50 border border-rose-100 flex items-center justify-center text-rose-500">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>

        <!-- Código de error -->
        <span class="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-wider text-rose-600 bg-rose-50 rounded-full mb-3"
              th:text="${codigoEstado} ? 'Error ' + ${codigoEstado} : 'Aviso del Sistema'">
            Error 500
        </span>

        <!-- Título -->
        <h1 class="text-2xl font-bold text-slate-900 mb-2" th:text="${tituloError} ?: 'Ha ocurrido un error'">
            Ha ocurrido un error
        </h1>

        <!-- Mensaje -->
        <p class="text-slate-600 text-sm mb-6 leading-relaxed" th:text="${mensajeUsuario} ?: 'No fue posible completar tu solicitud en este momento. Por favor intenta más tarde.'">
            No fue posible completar tu solicitud en este momento.
        </p>

        <!-- Acciones -->
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl font-medium text-sm text-white bg-slate-900 hover:bg-slate-800 transition shadow-sm">
                Volver a la Tienda
            </a>
            <button onclick="window.history.back()" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl font-medium text-sm text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
                Regresar
            </button>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-400">
            MultiStore &bull; Programación II
        </div>
    </div>
</body>
</html>
