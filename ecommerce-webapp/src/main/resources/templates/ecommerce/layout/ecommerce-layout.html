<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="layout(contenido)"
     class="store-shell">

    <!-- Menú comercial -->
    <div th:replace="~{ecommerce/fragments/ecommerce-navbar :: navbar}">
    </div>

    <!-- Contenido de cada página -->
    <main class="store-main">
        <th:block th:replace="${contenido}">
            Contenido de la tienda
        </th:block>
    </main>

    <!-- Footer -->
    <footer class="store-footer">
        <div class="container py-4">
            <div class="row align-items-center g-3">

                <div class="col-md-6">
                    <span class="footer-brand">
                        <i class="bi bi-bag-check-fill"></i>
                        E-COMMERCE
                    </span>
                </div>

                <div class="col-md-6 text-md-end">
                    <small>
                        © <span th:text="${#dates.year(#dates.createNow())}">2026</span>
                        E-COMMERCE. Todos los derechos reservados.
                    </small>
                </div>

            </div>
        </div>
    </footer>

    <!-- Bootstrap JS: incluye Popper -->
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>

</div>
