<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{ecommerce/fragments/ecommerce-head :: head('Resultado del pago')}">
</head>

<body class="store-body">

  <div th:replace="~{ecommerce/layout/ecommerce-layout :: layout(~{::contenido})}">
    <th:block th:fragment="contenido">

      <section class="container store-section" style="min-height: 55vh; padding-top: 48px; padding-bottom: 48px;">

        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="card shadow-sm card-body text-center py-5">

              <!-- Pago exitoso -->
              <div th:if="${exito}">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                <h1 class="h4 mt-3">¡Pago realizado con éxito!</h1>
                <p class="text-muted">Gracias por tu compra.</p>
                <div class="d-flex justify-content-between"><span>Pedido</span><strong th:text="${referencia}"></strong></div>
                <div class="d-flex justify-content-between"><span th:text="'Tarjeta (' + ${tipo} + ')'">Tarjeta</span>
                  <strong th:text="'•••• ' + ${ultimos4}"></strong></div>
                <div class="d-flex justify-content-between"><span>Total pagado</span>
                  <strong th:text="'$' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></strong></div>
                <a th:href="@{/}" class="btn btn-mustard mt-4">Volver al inicio</a>
              </div>

              <!-- Pago rechazado -->
              <div th:unless="${exito}">
                <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
                <h1 class="h4 mt-3">No se pudo realizar el pago</h1>
                <p class="text-muted">Tu tarjeta terminada en <strong th:text="${ultimos4}"></strong>
                  no tiene fondos suficientes. No se hizo ningún cobro.</p>
                <a th:href="@{/checkout}" class="btn btn-mustard">Intentar con otra tarjeta</a>
                <a th:href="@{/carrito}" class="btn btn-link">Volver al carrito</a>
              </div>

            </div>
          </div>
        </div>
      </section>

    </th:block>
  </div>

</body>
</html>
