<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{ecommerce/fragments/ecommerce-head :: head('Crear Cuenta')}">
</head>

<body>

<div th:replace="~{ecommerce/layout/ecommerce-layout :: layout(~{::contenido})}">

    <th:block th:fragment="contenido">

        <main class="container py-5 my-md-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-7 col-lg-5 col-xl-4">

                    <div class="auth-standalone-card p-4 p-md-5">

                        <!-- Brand Header -->
                        <div class="text-center mb-4">
                            <div class="logo-cart-badge mx-auto mb-2" style="width: 44px; height: 44px;" aria-hidden="true">
                                <svg class="multistore-cart-icon" width="30" height="30" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect x="13" y="8" width="7.5" height="9" rx="1.5" fill="#60a5fa" />
                                    <path d="M16.7 8V17" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
                                    <rect x="19.5" y="5" width="8.5" height="12" rx="1.5" fill="#fbbf24" />
                                    <path d="M23.7 5V17" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
                                    <path d="M10 11C10 9.8 11 9 12.2 9H13.5V17H10V11Z" fill="#34d399" />
                                    <path d="M4 6H7.5L10.5 21H27L30 9H9.5" stroke="#f1f5f9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M11 15H28.5" stroke="#f1f5f9" stroke-width="1.4" stroke-linecap="round"/>
                                    <circle cx="13" cy="26" r="2.5" fill="#60a5fa" stroke="#f1f5f9" stroke-width="1.8"/>
                                    <circle cx="25" cy="26" r="2.5" fill="#60a5fa" stroke="#f1f5f9" stroke-width="1.8"/>
                                </svg>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Crear una cuenta</h3>
                            <p class="text-secondary small mb-0">Únete a MultiStore y aprovecha envíos rápidos y ofertas</p>
                        </div>

                        <!-- Feedback Alerts -->
                        <div th:if="${mensajeError != null}" class="alert alert-danger d-flex align-items-center gap-2 small rounded-3 py-2 px-3 mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill text-danger fs-5 flex-shrink-0"></i>
                            <div th:text="${mensajeError}">Ha ocurrido un error al registrar la cuenta.</div>
                        </div>

                        <div th:if="${mensajeError == null and param.error != null}" class="alert alert-danger d-flex align-items-center gap-2 small rounded-3 py-2 px-3 mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill text-danger fs-5 flex-shrink-0"></i>
                            <div>Las contraseñas no coinciden. Por favor, inténtalo de nuevo.</div>
                        </div>

                        <!-- Formulario de Registro -->
                        <form th:action="@{/registro}" th:object="${registroDTO}" method="post">

                            <div class="mb-3">
                                <label for="correoInicioSesion" class="form-label small fw-bold text-secondary mb-1">Correo Electrónico</label>
                                <div class="input-group auth-input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                    <input id="correoInicioSesion"
                                           type="email"
                                           class="form-control border-start-0 ps-0"
                                           th:field="*{correoInicioSesion}"
                                           placeholder="tu-correo@ejemplo.com"
                                           autocomplete="email"
                                           required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="contrasenia" class="form-label small fw-bold text-secondary mb-1">Contraseña</label>
                                <div class="input-group auth-input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted">
                                        <i class="bi bi-shield-lock"></i>
                                    </span>
                                    <input id="contrasenia"
                                           type="password"
                                           class="form-control border-start-0 border-end-0 ps-0"
                                           th:field="*{contrasenia}"
                                           placeholder="Mínimo 6 caracteres"
                                           autocomplete="new-password"
                                           required>
                                    <button class="btn btn-outline-secondary border-start-0 bg-white text-muted"
                                            type="button"
                                            onclick="togglePasswordVisibility('contrasenia', this)"
                                            title="Mostrar u ocultar contraseña">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmarContrasenia" class="form-label small fw-bold text-secondary mb-1">Confirmar Contraseña</label>
                                <div class="input-group auth-input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted">
                                        <i class="bi bi-shield-check"></i>
                                    </span>
                                    <input id="confirmarContrasenia"
                                           type="password"
                                           class="form-control border-start-0 border-end-0 ps-0"
                                           th:field="*{confirmarContrasenia}"
                                           placeholder="Repite tu contraseña"
                                           autocomplete="new-password"
                                           required>
                                    <button class="btn btn-outline-secondary border-start-0 bg-white text-muted"
                                            type="button"
                                            onclick="togglePasswordVisibility('confirmarContrasenia', this)"
                                            title="Mostrar u ocultar contraseña">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-grid mb-3 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold py-2 rounded-3 shadow-xs d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-person-check-fill"></i>
                                    <span>Crear mi cuenta</span>
                                </button>
                            </div>

                            <div class="text-center pt-3 border-top">
                                <span class="text-muted small">¿Ya tienes una cuenta registrada?</span>
                                <a th:href="@{/inicio-sesion}" class="small fw-bold text-primary text-decoration-none ms-1">
                                    Inicia sesión aquí
                                </a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </main>

    </th:block>
</div>
</body>
</html>
