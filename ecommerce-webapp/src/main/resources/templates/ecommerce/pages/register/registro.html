<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{ecommerce/fragments/ecommerce-head :: head('Registro')}">
</head>

<body class="bg-light">

<div th:replace="~{ecommerce/layout/ecommerce-layout :: layout(~{::contenido})}">

    <th:block th:fragment="contenido">

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center mb-4">Crear una cuenta</h2>

                    <!-- Alerta dinámica de error de validación (ej. correo ya registrado o contraseñas no coinciden) -->
                    <div th:if="${mensajeError != null}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                        <div th:text="${mensajeError}">Ha ocurrido un error al registrar la cuenta.</div>
                    </div>

                    <div th:if="${mensajeError == null and param.error != null}" class="alert alert-danger text-center" role="alert">
                        Las contraseñas no coinciden. Por favor, inténtalo de nuevo.
                    </div>

                    <!-- El formulario conectado a tu RegistroUsuarioDTO -->
                    <form th:action="@{/registro}" th:object="${registroDTO}" method="post">

                        <div class="mb-3">
                            <label for="correoInicioSesion" class="form-label">Correo Electrónico</label>
                            <!-- th:field hace la magia: auto-genera el id, name y value -->
                            <input id="correoInicioSesion" type="email" class="form-control" th:field="*{correoInicioSesion}"
                                   placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasenia" class="form-label">Contraseña</label>
                            <input id="contrasenia" type="password" class="form-control" th:field="*{contrasenia}" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmarContrasenia" class="form-label">Confirmar Contraseña</label>
                            <input id="confirmarContrasenia" type="password" class="form-control" th:field="*{confirmarContrasenia}" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Registrarse</button>
                        </div>

                        <div class="text-center mt-4">
                            <span class="text-muted">¿Ya tienes una cuenta?</span>
                            <a th:href="@{/inicio-sesion}" class="text-decoration-none">Inicia sesión aquí</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>
        </th:block>
</div>
</body>
</html>
