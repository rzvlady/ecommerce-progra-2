<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{ecommerce/fragments/ecommerce-head :: head('Carrito')}">
</head>

<body class="store-body">

  <div th:replace="~{ecommerce/layout/ecommerce-layout :: layout(~{::contenido})}">
    <th:block th:fragment="contenido">

      <section class="container store-section" style="min-height: 55vh; padding-top: 48px; padding-bottom: 48px;">

        <h1 class="section-title mb-4 text-center">Mi Carrito</h1>

        <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <!-- Carrito vacio -->
        <div class="row justify-content-center" th:if="${resumen.cantidadTotal == 0}">
          <div class="col-lg-8 text-center">
            <i class="bi bi-cart3" style="font-size: 4rem; color: var(--store-primary, #d99b00);"></i>
            <p class="section-description my-4" style="font-size: 1rem;">
              Aún no has añadido productos a tu carrito.<br>
              Explora nuestra tienda y encuentra lo que buscas.
            </p>
            <a th:href="@{/}" class="btn btn-mustard">
              <i class="bi bi-arrow-left me-2"></i>
              Volver al inicio
            </a>
          </div>
        </div>

        <div class="row g-4" th:unless="${resumen.cantidadTotal == 0}">

          <!-- Productos seleccionados, cambiar cantidades o eliminar -->
          <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="table-responsive">
                <table class="table align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Producto</th>
                      <th class="text-end">Precio</th>
                      <th style="width: 110px;">Cantidad</th>
                      <th class="text-end">Subtotal</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="item : ${items}">
                      <td>
                        <div class="fw-semibold" th:text="${item.nombre}">Producto</div>
                        <small class="text-muted" th:text="${item.sku}">SKU</small>
                      </td>
                      <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(item.precioUnitario, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                      <td>
                        <form th:action="@{/carrito/actualizar}" method="post">
                          <input type="hidden" name="idProducto" th:value="${item.idProducto}">
                          <input type="number" name="cantidad" class="form-control form-control-sm"
                                 min="0" th:max="${item.stockDisponible}" th:value="${item.cantidad}"
                                 onchange="this.form.submit()">
                        </form>
                      </td>
                      <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                      <td class="text-end">
                        <form th:action="@{/carrito/eliminar}" method="post">
                          <input type="hidden" name="idProducto" th:value="${item.idProducto}">
                          <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                            <i class="bi bi-trash"></i>
                          </button>
                        </form>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="d-flex justify-content-between mt-3">
              <a th:href="@{/}" class="btn btn-link"><i class="bi bi-arrow-left me-1"></i> Seguir comprando</a>
              <form th:action="@{/carrito/vaciar}" method="post">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Vaciar carrito</button>
              </form>
            </div>
          </div>

          <!-- Subtotal, envio y total + continuar con la compra -->
          <div class="col-lg-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h2 class="h5 mb-3">Resumen del pedido</h2>
                <div class="d-flex justify-content-between mb-2">
                  <span>Subtotal</span>
                  <span th:text="'$' + ${#numbers.formatDecimal(resumen.subtotal, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <span>Envío</span>
                  <span th:text="${resumen.envio.signum() == 0} ? 'Gratis' : '$' + ${#numbers.formatDecimal(resumen.envio, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                  <span>Total</span>
                  <span th:text="'$' + ${#numbers.formatDecimal(resumen.total, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                </div>
                <a th:href="@{/checkout}" class="btn btn-mustard w-100">
                  Continuar con la compra
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

    </th:block>
  </div>

</body>
</html>
