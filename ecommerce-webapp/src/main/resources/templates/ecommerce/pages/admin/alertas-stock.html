<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas de Stock - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Productos con Stock Bajo</h4>
                </div>
                <div class="card-body">

                    <div th:if="${#lists.isEmpty(productos)}" class="alert alert-success" role="alert">
                        No hay productos por debajo de su stock mínimo.
                    </div>

                    <table th:unless="${#lists.isEmpty(productos)}" class="table table-striped align-middle">
                        <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Marca</th>
                            <th class="text-end">Stock Disponible</th>
                            <th class="text-end">Stock Mínimo</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.nombreProducto}"></td>
                            <td th:text="${producto.categoria.nombreCategoria}"></td>
                            <td th:text="${producto.marca.nombreMarca}"></td>
                            <td class="text-end" th:text="${producto.stockDisponible}"></td>
                            <td class="text-end" th:text="${producto.stockMinimo}"></td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
