<header th:fragment="navbar"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        class="store-header sticky-top">

    <!-- Fila superior: Logo, Buscador Reactivo, Carrito & Perfil -->
    <div class="container-fluid px-3 px-md-4 px-xl-5 py-2 py-lg-3">
        <div class="row align-items-center g-2 g-md-3">

            <!-- Logo de MultiStore -->
            <div class="col-6 col-md-3 col-lg-3">
                <a th:href="@{/}" class="multistore-logo" title="MultiStore - Ir al Inicio">
                    <div class="logo-cart-badge" aria-hidden="true">
                        <svg class="multistore-cart-icon" width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="13" y="8" width="7.5" height="9" rx="1.5" fill="#3b82f6" />
                            <path d="M16.7 8V17" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
                            <rect x="19.5" y="5" width="8.5" height="12" rx="1.5" fill="#f59e0b" />
                            <path d="M23.7 5V17" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
                            <path d="M10 11C10 9.8 11 9 12.2 9H13.5V17H10V11Z" fill="#10b981" />
                            <path d="M4 6H7.5L10.5 21H27L30 9H9.5" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M11 15H28.5" stroke="#1e293b" stroke-width="1.4" stroke-linecap="round"/>
                            <circle cx="13" cy="26" r="2.5" fill="#2563eb" stroke="#1e293b" stroke-width="1.8"/>
                            <circle cx="25" cy="26" r="2.5" fill="#2563eb" stroke="#1e293b" stroke-width="1.8"/>
                        </svg>
                    </div>
                    <div class="d-flex flex-column justify-content-center">
                        <span class="logo-multi">Multi</span>
                        <span class="logo-store">Store</span>
                    </div>
                </a>
            </div>

            <!-- Buscador Central Reactivo (Sin botón Buscar, con sugerencias automáticas) -->
            <div class="col-12 col-md-5 col-lg-6 order-last order-md-2 mt-2 mt-md-0">
                <div class="search-reactive-wrapper position-relative mx-auto" style="max-width: 580px;">
                    <form th:action="@{/productos}" method="get" role="search" class="m-0 w-100">
                        <div class="input-group search-panel-group">
                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="search"
                                   name="busqueda"
                                   id="storeSearchInput"
                                   autocomplete="off"
                                   class="form-control"
                                   placeholder="¿Qué estás buscando hoy? Ej. Laptops, auriculares..."
                                   th:value="${param.busqueda != null ? param.busqueda : (busqueda != null ? busqueda : '')}"
                                   aria-label="Buscar productos">
                            <!-- Indicador de carga y botón para limpiar -->
                            <button type="button" class="btn btn-link btn-clear-search d-none text-muted p-0 me-2" id="btnClearSearch" aria-label="Limpiar campo">
                                <i class="bi bi-x-circle-fill"></i>
                            </button>
                            <div class="search-loading-spinner d-none" id="searchSpinner">
                                <div class="spinner-border spinner-border-sm text-warning" role="status">
                                    <span class="visually-hidden">Buscando...</span>
                                </div>
                            </div>
                        </div>
                    </form>

                    <!-- Dropdown flotante de sugerencias reactivas -->
                    <div id="searchSuggestionsBox" class="search-suggestions-dropdown shadow-lg d-none" role="listbox">
                    </div>
                </div>
            </div>

            <!-- Acciones de Usuario: Carrito y Perfil -->
            <div class="col-6 col-md-4 col-lg-3 order-2 order-md-3">
                <div class="header-actions-group">

                    <!-- Carrito de Compras -->
                    <a th:href="@{/carrito}" class="header-cart-btn" title="Ver carrito de compras">
                        <div class="cart-icon-wrapper">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span class="header-cart-badge" th:text="${carritoCantidad}">0</span>
                        </div>
                        <span class="d-none d-md-inline">Carrito</span>
                    </a>

                    <!-- Separador visual -->
                    <div class="header-action-divider d-none d-sm-block"></div>

                    <!-- Menú de Usuario / Perfil -->
                    <div class="dropdown">
                        <button class="header-profile-btn profile-dropdown-btn dropdown-toggle border-0"
                                type="button"
                                id="perfilDropdown"
                                data-bs-toggle="dropdown"
                                data-bs-display="static"
                                aria-expanded="false"
                                title="Mi Cuenta y Acceso">
                            <i class="bi bi-person-circle fs-5 text-secondary"></i>
                            <span class="d-none d-md-inline" sec:authorize="isAnonymous()">Mi Cuenta</span>
                            <span class="d-none d-md-inline text-truncate"
                                  style="max-width: 150px;"
                                  sec:authorize="isAuthenticated()"
                                  th:text="${nombreMostradoUsuario != null ? nombreMostradoUsuario : 'Usuario'}">Usuario</span>
                            <i class="bi bi-chevron-down small text-muted"></i>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end profile-dropdown-menu mt-2" aria-labelledby="perfilDropdown">
                            <!-- Estado: NO autenticado -->
                            <li sec:authorize="isAnonymous()">
                                <h6 class="dropdown-header">Acceso a tu cuenta</h6>
                            </li>
                            <li sec:authorize="isAnonymous()">
                                <a class="dropdown-item d-flex align-items-center gap-2 fw-semibold" href="javascript:void(0)" onclick="abrirModalAuth('login')">
                                    <i class="bi bi-box-arrow-in-right text-primary fs-5"></i>
                                    <span>Iniciar sesión</span>
                                </a>
                            </li>
                            <li sec:authorize="isAnonymous()">
                                <a class="dropdown-item d-flex align-items-center gap-2" href="javascript:void(0)" onclick="abrirModalAuth('register')">
                                    <i class="bi bi-person-plus text-success fs-5"></i>
                                    <span>Registrarse</span>
                                </a>
                            </li>

                            <!-- Estado: AUTENTICADO -->
                            <li sec:authorize="isAuthenticated()">
                                <h6 class="dropdown-header">Conectado como</h6>
                                <div class="px-3 py-1 mb-1 fw-bold text-dark text-truncate" style="max-width: 200px;" sec:authentication="name">Usuario</div>
                            </li>
                            <li sec:authorize="isAuthenticated()"><hr class="dropdown-divider my-1"></li>
                            <!-- Enlace al Backoffice exclusivo para ROLE_ADMIN -->
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item d-flex align-items-center gap-2 text-primary fw-semibold" th:href="@{/backoffice/dashboard}">
                                    <i class="bi bi-speedometer2 text-primary fs-5"></i>
                                    <span>Panel Backoffice</span>
                                </a>
                            </li>
                            <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider my-1"></li>
                            <li sec:authorize="isAuthenticated()">
                                <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/mi-perfil}">
                                    <i class="bi bi-person-circle text-primary fs-5"></i>
                                    <span>Mi Cuenta</span>
                                </a>
                            </li>
                            <li sec:authorize="isAuthenticated()"><hr class="dropdown-divider my-1"></li>
                            <li sec:authorize="isAuthenticated()">
                                <form th:action="@{/cerrar-sesion}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item text-danger d-flex align-items-center gap-2 w-100 border-0 bg-transparent text-start">
                                        <i class="bi bi-box-arrow-right fs-5"></i>
                                        <span>Cerrar sesión</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Barra de Categorías Responsive (Menu Amarillo fluido con scroll suave y Drawer móvil) -->
    <nav class="store-category-bar">
        <div class="container-fluid px-2 px-md-3 px-xl-4 px-xxl-5">
            <div class="category-scroll-wrapper position-relative d-flex align-items-center">

                <!-- Botón Drawer para móviles/tablets -->
                <button class="btn btn-category-drawer text-white d-inline-flex align-items-center gap-1.5 flex-shrink-0 me-1 me-md-2"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasCategorias"
                        aria-controls="offcanvasCategorias"
                        title="Ver todas las categorías">
                    <i class="bi bi-grid-3x3-gap-fill"></i>
                    <span class="d-none d-sm-inline fw-bold small text-uppercase">Categorías</span>
                </button>

                <div class="category-divider-v me-1 me-md-2"></div>

                <!-- Flecha de desplazamiento izquierda (aparece si hay desborde) -->
                <button class="category-scroll-btn btn-left d-none" id="btnCatScrollLeft" type="button" aria-label="Desplazar a la izquierda" title="Desplazar a la izquierda">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <div class="category-fade-indicator fade-left d-none" id="catFadeLeft"></div>

                <!-- Contenedor scrollable de enlaces de categorías -->
                <div class="category-scroll-container d-flex align-items-center gap-1 gap-md-2" id="categoryScrollContainer">
                    <a th:href="@{/productos}"
                       class="category-nav-link"
                       th:classappend="${idCategoriaSeleccionada == null and param.idCategoria == null and param.busqueda == null} ? 'active' : ''">
                        <i class="bi bi-grid me-1"></i> Todo
                    </a>

                    <a th:each="cat : ${categoriasNavbar != null ? categoriasNavbar : categorias}"
                       th:href="@{/productos(idCategoria=${cat.idCategoria})}"
                       class="category-nav-link"
                       th:classappend="${idCategoriaSeleccionada != null and idCategoriaSeleccionada == cat.idCategoria} ? 'active' : ''"
                       th:text="${#strings.toUpperCase(cat.nombreCategoria)}">
                        CATEGORÍA
                    </a>
                </div>

                <!-- Flecha de desplazamiento derecha (aparece si hay desborde) -->
                <div class="category-fade-indicator fade-right d-none" id="catFadeRight"></div>
                <button class="category-scroll-btn btn-right d-none" id="btnCatScrollRight" type="button" aria-label="Desplazar a la derecha" title="Desplazar a la derecha">
                    <i class="bi bi-chevron-right"></i>
                </button>

            </div>
        </div>
    </nav>

    <!-- Offcanvas lateral de Categorías (Optimizado para móviles y tablets) -->
    <div class="offcanvas offcanvas-start store-offcanvas" tabindex="-1" id="offcanvasCategorias" aria-labelledby="offcanvasCategoriasLabel">
        <div class="offcanvas-header text-white">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-grid-3x3-gap-fill text-warning fs-5"></i>
                <h5 class="offcanvas-title fw-bold m-0" id="offcanvasCategoriasLabel">Categorías MultiStore</h5>
            </div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div class="p-3 border-bottom bg-light">
                <a th:href="@{/productos}" class="btn btn-mustard w-100 fw-bold d-flex align-items-center justify-content-center gap-2 shadow-xs">
                    <i class="bi bi-grid"></i>
                    <span>Ver Todo el Catálogo</span>
                </a>
            </div>
            <div class="p-2">
                <span class="text-uppercase text-muted fw-bold px-3 py-2 d-block small" style="letter-spacing: 0.05em;">Categorías & sub categorías</span>
                <ul class="list-group list-group-flush offcanvas-category-list">
                    <li th:each="cat : ${categoriasArbol != null ? categoriasArbol : (categoriasNavbar != null ? categoriasNavbar : categorias)}" class="list-group-item border-0 p-0 mb-1">
                        <!-- Categoría con subcategorías (Desplegable / Acordeón) -->
                        <div th:if="${cat['subcategorias'] != null and !cat.subcategorias.isEmpty()}">
                            <button type="button"
                                    class="offcanvas-cat-btn d-flex align-items-center justify-content-between w-100 px-3 py-2.5 rounded-3 border-0 bg-transparent text-start"
                                    data-bs-toggle="collapse"
                                    th:data-bs-target="'#subcatCollapse-' + ${cat.idCategoria}"
                                    th:aria-controls="'subcatCollapse-' + ${cat.idCategoria}"
                                    aria-expanded="false">
                                <span class="d-flex align-items-center gap-2.5 fw-semibold text-dark">
                                    <i class="bi bi-folder2-open text-warning"></i>
                                    <span th:text="${cat.nombreCategoria}">Categoría</span>
                                    <span class="badge rounded-pill bg-light text-muted border subcat-count" th:text="${#lists.size(cat.subcategorias)}">0</span>
                                </span>
                                <i class="bi bi-chevron-down subcat-chevron text-muted small"></i>
                            </button>

                            <!-- Desglose de subcategorías -->
                            <div class="collapse subcat-collapse" th:id="'subcatCollapse-' + ${cat.idCategoria}">
                                <div class="subcat-menu ps-3 pe-2 py-1">
                                    <a th:href="@{/productos(idCategoria=${cat.idCategoria})}"
                                       class="subcat-link d-flex align-items-center gap-2 py-1.5 px-3 rounded-2 text-decoration-none fw-semibold text-primary"
                                       th:classappend="${idCategoriaSeleccionada != null and idCategoriaSeleccionada == cat.idCategoria} ? 'active-subcat' : ''">
                                        <i class="bi bi-arrow-right-short fs-5"></i>
                                        <span th:text="'Ver todo en ' + ${cat.nombreCategoria}">Ver todo</span>
                                    </a>
                                    <a th:each="sub : ${cat.subcategorias}"
                                       th:href="@{/productos(idCategoria=${sub.idCategoria})}"
                                       class="subcat-link d-flex align-items-center justify-content-between py-1.5 px-3 rounded-2 text-decoration-none text-muted"
                                       th:classappend="${idCategoriaSeleccionada != null and idCategoriaSeleccionada == sub.idCategoria} ? 'active-subcat fw-bold text-dark' : ''">
                                        <span class="d-flex align-items-center gap-2">
                                            <i class="bi bi-dot fs-5 text-warning"></i>
                                            <span th:text="${sub.nombreCategoria}">Subcategoría</span>
                                        </span>
                                        <i class="bi bi-chevron-right text-muted x-small"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Categoría hoja sin subcategorías (Enlace directo) -->
                        <div th:if="${cat['subcategorias'] == null or cat.subcategorias.isEmpty()}">
                            <a th:href="@{/productos(idCategoria=${cat.idCategoria})}"
                               class="offcanvas-cat-link d-flex align-items-center justify-content-between px-3 py-2.5 rounded-3 text-decoration-none"
                               th:classappend="${idCategoriaSeleccionada != null and idCategoriaSeleccionada == cat.idCategoria} ? 'active-offcanvas-cat' : ''">
                                <span class="d-flex align-items-center gap-2.5 fw-semibold text-dark">
                                    <i class="bi bi-folder2 text-warning"></i>
                                    <span th:text="${cat.nombreCategoria}">Categoría</span>
                                </span>
                                <i class="bi bi-chevron-right text-muted small"></i>
                            </a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
